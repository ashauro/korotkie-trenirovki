<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Короткие тренировки</title>
<meta name="description" content="Короткая силовая тренировка каждый день: 5, 10 или 15 минут. Дома с гантелями или в поездке без оборудования.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF1F7" id="theme-color">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="Короткие тренировки">
<meta property="og:description" content="Силовая тренировка на 10 минут в день: дома с гантелями или в поездке без оборудования.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/sofia-sans-condensed-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>

<div class="wrap" id="app"></div>

<nav id="nav" aria-label="Разделы" hidden>
  <div class="in">
    <button data-act="nav" data-view="today"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M7 6v12M17 6v12M20 9v6M7 12h10"/></svg>Сегодня</button>
    <button data-act="nav" data-view="progress"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>Прогресс</button>
    <button data-act="nav" data-view="options"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9M15 5v4M9 15v4"/></svg>Настройки</button>
  </div>
</nav>

<div class="overlay" id="player" hidden></div>
<div class="overlay" id="runner" hidden></div>
<div class="backdrop" id="sheet" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<noscript><p style="padding:24px;font-family:sans-serif">Для работы приложения включи JavaScript в браузере.</p></noscript>
<script src="app.js"></script>
</body>
</html>
